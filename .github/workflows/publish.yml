# =============================================================================
# FluentUI Agent Skill — NPM Publish Workflow
# =============================================================================
#
# Publishes the package to npm with trusted publishing (GitHub OIDC), so no
# long-lived NPM_TOKEN is required. See
# https://docs.npmjs.com/trusted-publishers.
#
# This file is the MANUAL publisher (dry run / emergency release). Automated
# version bumps and releases are handled by release-please.yml together with
# release-please-config.json and .release-please-manifest.json.
#
# Setup: the first version was published by hand to create the package.
# Configure the trusted publisher on npmjs.com (Package -> Settings ->
# Trusted publishing -> Add -> GitHub Actions) for the automated publisher:
#   - Organization or user: blendsdk
#   - Repository:           fluentui-mcp
#   - Workflow filename:    release-please.yml
#   - Allowed actions:      tick "npm publish" (connections created after
#     2026-09-03 default to `npm stage publish` only).
# Add a second connection for `publish.yml` only if you also publish manually.
# To use staged publishing instead, change the publish step to
# `npm stage publish` and approve each release by hand before it is public.
# After the first OIDC publish succeeds, optionally set the package's
# Publishing access to "Require 2FA and disallow tokens" and revoke any token
# that is no longer needed.
#
# To publish manually: Actions -> "Publish to npm" -> Run workflow. `dry_run`
# defaults to true; set it to false to publish.
#
# Requirements verified by this workflow:
#   - `id-token: write` on the publishing job.
#   - Node.js >= 22.14 and npm CLI >= 11.5.1 for OIDC.
#   - No NODE_AUTH_TOKEN; npm exchanges the GitHub OIDC token automatically.
#   - `repository.url` in package.json matches this GitHub repository.
# =============================================================================

name: Publish to npm

permissions:
    contents: read

on:
    # Manual trigger only (inactive by default)
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Dry run (skip actual publish)"
                required: false
                default: "true"
                type: choice
                options:
                    - "true"
                    - "false"

    # Automated releases are handled by release-please.yml, which publishes in
    # the same workflow that tags the release. Do not add a `release:` trigger
    # here, or every release would be published twice.

jobs:
    # ===========================================================================
    # Job 1: Build, test, and run the skill integrity gates
    # ===========================================================================
    build-and-test:
        name: Build & Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build

            - name: Run tests
              run: yarn test

            - name: Check skill drift and coverage
              run: yarn skill:check

            - name: Validate skill examples
              run: yarn skill:validate

    # ===========================================================================
    # Job 2: Publish to npm with trusted publishing (OIDC)
    # ===========================================================================
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        needs: build-and-test
        # Required for trusted publishing. Job-level permissions replace the
        # workflow-level set, so `contents: read` is repeated here.
        permissions:
            contents: read
            id-token: write
        # `setup-node` writes an `.npmrc` that references `${NODE_AUTH_TOKEN}`.
        # Define it empty so Yarn classic can resolve it during `yarn install`;
        # the publish itself authenticates with OIDC, never this variable.
        env:
            NODE_AUTH_TOKEN: ""

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
                  # Never cache in a release build.
                  package-manager-cache: false

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            # Node 24 ships npm 11, but pin the floor the OIDC exchange needs.
            - name: Upgrade npm for trusted publishing
              run: npm install -g npm@^11.5.1

            - name: Build the published artifacts
              run: yarn build && yarn assemble

            # Read the pack file list as JSON so the checks match exact paths.
            # A plain `grep "data/"` would also match the generated
            # `skills/fluentui/references/recipes/data/` pages and always fail.
            - name: Verify package contents
              run: |
                  npm pack --dry-run --ignore-scripts --json > pack-output.json
                  node -e '
                    const files = require("./pack-output.json")[0].files.map((f) => f.path);
                    const required = ["skills/fluentui/SKILL.md", "dist/bin.js"];
                    for (const path of required) {
                      if (!files.includes(path)) {
                        console.error("::error::" + path + " not included in npm package");
                        process.exit(1);
                      }
                    }
                    if (files.some((p) => p.startsWith("data/"))) {
                      console.error("::error::data/ must not be included in npm package");
                      process.exit(1);
                    }
                    console.log("Package contents verified: " + files.length + " files");
                  '

            - name: Publish to npm (dry run)
              if: ${{ github.event.inputs.dry_run == 'true' || github.event.inputs.dry_run == '' }}
              run: npm publish --dry-run

            # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
            # short-lived registry token. Provenance is generated automatically.
            - name: Publish to npm
              if: ${{ github.event.inputs.dry_run == 'false' }}
              run: npm publish

    # ===========================================================================
    # Job 3: Verify published package (optional)
    # ===========================================================================
    verify:
        name: Verify Published Package
        runs-on: ubuntu-latest
        needs: publish
        if: ${{ github.event.inputs.dry_run == 'false' }}

        steps:
            - name: Setup Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Wait for npm propagation
              run: sleep 30

            - name: Install published package globally
              run: npm install -g fluentui-skill

            - name: Verify binary exists
              run: which fluentui

            - name: Verify CLI runs
              run: fluentui --help
