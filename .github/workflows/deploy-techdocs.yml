# =============================================================================
# FluentUI MCP Server — Technical Docs (GitHub Pages)
# =============================================================================
#
# Builds the VitePress technical-architecture site in techdocs/ and deploys it
# to GitHub Pages. Uses the "GitHub Actions" Pages source — Pages serves the
# uploaded artifact (techdocs/.vitepress/dist), NOT a repo folder, so it never
# collides with the FluentUI content under docs/v9/.
#
# One-time setup (manual): repo Settings → Pages → Build and deployment →
#   Source = "GitHub Actions".
#
# Published at: https://blendsdk.github.io/fluentui-mcp/
# (VitePress base is set to '/fluentui-mcp/' to match the project-pages path.)
# =============================================================================

name: Deploy Tech Docs

on:
    push:
        branches: [main]
        paths:
            - "techdocs/**"
            - ".github/workflows/deploy-techdocs.yml"
            - "package.json"
    # Allow manual runs from the Actions tab.
    workflow_dispatch:

# Allow this workflow to publish to GitHub Pages.
permissions:
    contents: read
    pages: write
    id-token: write

# Only one concurrent Pages deployment; don't cancel an in-progress deploy.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        name: Build VitePress site
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build docs
              run: yarn docs:build

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: techdocs/.vitepress/dist

    deploy:
        name: Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
