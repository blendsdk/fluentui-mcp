# =============================================================================
# FluentUI Agent Skill — Release Please
# =============================================================================
#
# Automatic semantic versioning from Conventional Commits. On every push to
# `master`, release-please opens (or updates) a release PR that bumps
# `package.json` and `CHANGELOG.md`. Merging that PR tags the commit
# (`vX.Y.Z`) and creates the GitHub Release.
#
# When a release is created, the `publish` job publishes it to npm with
# trusted publishing (OIDC). Publishing is a separate job so a failed publish
# can be retried on its own ("Re-run failed jobs") without re-running
# release-please.
#
# Commit -> version mapping: `feat:` -> minor, `fix:` -> patch,
# `feat!:`/`fix!:`/any `!` -> major.
#
# npm trusted publishing (OIDC):
#   npm requires the package to exist before a trusted publisher can be set,
#   so the very first version was published by hand (bootstrap). From then on
#   every release is published here automatically. Configure the trusted
#   publisher on npmjs.com (Package -> Settings -> Trusted publishing) for:
#     - Organization or user: blendsdk
#     - Repository:           fluentui-mcp
#     - Workflow filename:    release-please.yml
#   Provenance attestations are generated automatically.
# =============================================================================

name: Release Please

on:
    push:
        branches: [master]

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release:
        name: Release Please
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}

        steps:
            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@v5
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    # ---------------------------------------------------------------------------
    # Publish the release with trusted publishing (OIDC). Runs only when
    # release-please created a release. Kept separate from the release job so
    # it can be re-run on its own after a transient publish failure.
    # ---------------------------------------------------------------------------
    publish:
        name: Publish to npm
        needs: release
        if: ${{ needs.release.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        # Required for trusted publishing.
        permissions:
            contents: read
            id-token: write
        # `setup-node` writes an `.npmrc` that references `${NODE_AUTH_TOKEN}`.
        # Define it empty so Yarn classic can resolve it during `yarn install`;
        # the publish itself authenticates with OIDC, never this variable.
        env:
            NODE_AUTH_TOKEN: ""

        steps:
            - name: Checkout release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release.outputs.tag_name }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
                  # Never cache in a release build.
                  package-manager-cache: false

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            # Node 24 ships npm 11, but pin the floor the OIDC exchange needs.
            - name: Upgrade npm for trusted publishing
              run: npm install -g npm@^11.5.1

            - name: Build the published artifacts
              run: yarn build && yarn assemble

            # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
            # short-lived registry token. Provenance is generated automatically.
            - name: Publish to npm
              run: npm publish
