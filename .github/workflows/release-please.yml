# =============================================================================
# FluentUI Agent Skill — Release & Publish
# =============================================================================
#
# One workflow owns versioning and publishing.
#
# On every push to `master`, release-please opens (or updates) a release PR
# that bumps `package.json` and `CHANGELOG.md`. Merging that PR tags the commit
# (`vX.Y.Z`) and creates the GitHub Release; the `publish` job then publishes
# that tag to npm with trusted publishing (OIDC). Publishing is a separate job
# so a failed publish can be retried on its own.
#
# Commit -> version mapping: `feat:` -> minor, `fix:` -> patch,
# `feat!:`/`fix!:`/any `!` -> major.
#
# Manual dispatch publishes an existing tag (for example to backfill a release
# whose publish failed). Leave `tag` empty to do nothing.
#
# npm trusted publishing (OIDC):
#   Configure the trusted publisher on npmjs.com (Package -> Settings ->
#   Trusted publishing -> Add -> GitHub Actions) for:
#     - Organization or user: blendsdk
#     - Repository:           fluentui-mcp
#     - Workflow filename:    release-please.yml
#     - Allowed actions:      tick "npm publish"
#   Provenance attestations are generated automatically.
# =============================================================================

name: Release Please

on:
    push:
        branches: [master]
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing tag to publish (for example v1.3.1). Leave empty to do nothing."
                required: false
                default: ""

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release:
        name: Release Please
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}

        steps:
            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@v5
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    # ---------------------------------------------------------------------------
    # Publish a created release (push) or an explicitly requested tag (dispatch).
    # ---------------------------------------------------------------------------
    publish:
        name: Publish to npm
        needs: release
        if: >-
            ${{
              always() &&
              ((github.event_name == 'push' && needs.release.outputs.release_created == 'true') ||
               (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''))
            }}
        runs-on: ubuntu-latest
        # Required for trusted publishing.
        permissions:
            contents: read
            id-token: write
        # `setup-node` writes an `.npmrc` that references `${NODE_AUTH_TOKEN}`.
        # Define it empty so Yarn classic can resolve it during `yarn install`;
        # the publish itself authenticates with OIDC, never this variable.
        env:
            NODE_AUTH_TOKEN: ""

        steps:
            - name: Resolve tag
              id: target
              run: |
                  echo "ref=${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.tag) || needs.release.outputs.tag_name }}" >> "$GITHUB_OUTPUT"

            - name: Checkout release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ steps.target.outputs.ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
                  # Never cache in a release build.
                  package-manager-cache: false

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            # Node 24 ships npm 11, but pin the floor the OIDC exchange needs.
            - name: Upgrade npm for trusted publishing
              run: npm install -g npm@^11.5.1

            - name: Build the published artifacts
              run: yarn build && yarn assemble

            # Read the pack file list as JSON so the checks match exact paths.
            # A plain `grep "data/"` would also match the generated
            # `skills/fluentui/references/recipes/data/` pages and always fail.
            - name: Verify package contents
              run: |
                  npm pack --dry-run --ignore-scripts --json > pack-output.json
                  node -e '
                    const files = require("./pack-output.json")[0].files.map((f) => f.path);
                    const required = ["skills/fluentui/SKILL.md", "dist/bin.js"];
                    for (const path of required) {
                      if (!files.includes(path)) {
                        console.error("::error::" + path + " not included in npm package");
                        process.exit(1);
                      }
                    }
                    if (files.some((p) => p.startsWith("data/"))) {
                      console.error("::error::data/ must not be included in npm package");
                      process.exit(1);
                    }
                    console.log("Package contents verified: " + files.length + " files");
                  '

            # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
            # short-lived registry token. Provenance is generated automatically.
            - name: Publish to npm
              run: npm publish
