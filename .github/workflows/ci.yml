# =============================================================================
# FluentUI Agent Skill — Continuous Integration
# =============================================================================
#
# Builds and tests the package, then runs the skill integrity gates, on every
# push to master and on every pull request targeting master. Targets the
# project's supported Node.js version.
# =============================================================================

name: CI

permissions:
    contents: read

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build-and-test:
        name: Build & Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build

            - name: Run tests
              run: yarn test

            - name: Check skill drift and coverage
              run: yarn skill:check

            - name: Validate skill examples
              run: yarn skill:validate
