# =============================================================================
# FluentUI MCP Server — Continuous Integration
# =============================================================================
#
# Builds and tests the package on every push to master and on every pull
# request targeting master. Runs against the supported Node.js LTS versions.
# =============================================================================

name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build-and-test:
        name: Build & Test (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                node-version: [20, 22]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build

            - name: Run tests
              run: yarn test
